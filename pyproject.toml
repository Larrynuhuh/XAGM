[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xagm"
version = "0.2.3"
description = "A high-performance, coordinate-free Riemannian geometry library accelerated by JAX and Diffrax"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SWASTIK", email = "swastiksingh1402@gmai.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "jaxtyping>=0.2.0",
    "diffrax>=0.5.0",
]

[project.urls]
Homepage = "https://github.com"
Documentation = "https://github.com#readme"
Repository = "https://github.com.git"
Issues = "https://github.com/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

