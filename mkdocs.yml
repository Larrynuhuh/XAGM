site_name: XAGM
site_description: High-performance, lightweight and coordinate-free Riemannian geometry utilities accelerated by JAX and Diffrax.
site_author: SWASTIK

theme:
  name: material
  
  # FIXED: Point to your custom image using 'logo' instead of 'icon.logo'
  logo: assets/xagmlogo.jpeg 
  
  palette:
    - scheme: default
      primary: black
      accent: red
  features:
    - navigation.tabs
    - content.code.copy
  icon:
    repo: github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_submodules: false

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

# FIXED: Removed the empty cloudflare links
extra_javascript:
  - javascripts/katex.js

# FIXED: Removed the empty cloudflare links
extra_css:
  - stylesheets/custom.css
